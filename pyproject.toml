[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-platform"
version = "0.1.0"
description = "Single-user ETF research and backtesting platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Quant Research Platform" }]
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
backtest = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "vectorbt>=0.26,<1",
]
api = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["packages/qt_core", "services/api", "services/worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qt_core", "qt_api", "qt_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/qt_core", "services/api", "services/worker"]
addopts = "-q"
